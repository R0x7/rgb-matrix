# ledcube configuration. Apply most changes live with:  cubectl reload
# (the "hardware" section needs a service restart instead).

# --- hardware (restart needed) ---
gpio_mapping = adafruit-hat-pwm      # adafruit-hat-pwm if you did the GPIO4-GPIO18 solder mod
gpio_slowdown = 2              # raise if the picture is garbled, lower for a faster refresh
pwm_bits = 8                    # 1..11; lower = faster refresh, fewer colour steps
pwm_lsb_nanoseconds = 130        # base pulse length; raise if dim colours look unstable
pwm_dither_bits = 1           # 1..2 trades a little colour stability for a faster refresh
limit_refresh_hz = 150          # 0 = as fast as possible; a fixed value a bit below the
                                 # measured rate ("cubectl status" shows it) gives a steadier image
#panel_type = FM6126A            # only if the panels stay dark without it

# --- which panel is which face ---
# face = <position in chain, 0..2>:<rotation of that panel, 0/90/180/270>
top = 2:180
left = 1:90
right = 0:270

# --- look ---
brightness = 34                 # 1..100
fps = 40
#night_start = 23                # dim between these hours
#night_end = 7
#night_brightness = 10

# --- auto mode ---
playlist = clock,plasma,stats,fire,clock,ripples,stats,vortex,clock,lava,stats,fireworks,clock,rain,stats,orbs,clock,life,stats,kaleido,clock,warp,stats,storm,clock,comets,stats,tank,clock,tribar,stats,lattice,clock,metamorph,stats,droste
ambient_seconds = 60
clock_seconds = 25
stats_seconds = 20
audio_takeover = 0               # 1 = music playing on the PC switches to the visualizer
audio_hold_seconds = 8

# --- clock / weather (weather comes from open-meteo.com; leave blank for none) ---
clock_24h = 0
units = F
latitude = 34.147
longitude = -118.144

# --- misc ---
port = 7777
font_dir = /opt/ledcube/fonts
